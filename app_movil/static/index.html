<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SNIPER PWA AUTONOMA V10</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#10b981">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background-color: #070b14;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      touch-action: manipulation;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card-active {
      background: rgba(6, 78, 59, 0.4);
      border: 1px solid rgba(16, 185, 129, 0.4);
      box-shadow: 0 0 25px -5px rgba(16, 185, 129, 0.25);
    }
    .chip {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="min-h-screen pb-24 selection:bg-emerald-500 selection:text-white">

  <!-- HEADER FIJO -->
  <header class="sticky top-0 z-40 glass-card border-b border-slate-800/80 px-4 py-3">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-500/20">
          <i data-lucide="crosshair" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <div class="flex items-center space-x-1.5">
            <h1 class="text-sm font-black tracking-wider text-white uppercase">SNIPER V10</h1>
            <span class="px-1.5 py-0.5 text-[9px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded">100% AUTONOMO</span>
          </div>
          <p id="reloj-header" class="text-[11px] font-mono text-slate-400">12:00:00 p. m.</p>
        </div>
      </div>

      <div class="flex items-center space-x-2">
        <button onclick="abrirModalEntrada()" class="px-3 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs flex items-center space-x-1.5 shadow-lg shadow-amber-500/20 active:scale-95 transition-all">
          <i data-lucide="plus-circle" class="w-4 h-4"></i>
          <span>Anotar Sorteo</span>
        </button>
      </div>
    </div>

    <!-- TARJETA FINANCIERA -->
    <div class="mt-3 pt-2.5 border-t border-slate-800/80 grid grid-cols-4 gap-2 text-center">
      <div>
        <span class="text-[10px] text-slate-400 font-medium block">Operaciones</span>
        <span id="hdr-ops" class="text-xs font-bold text-slate-200">0 (0 Hits)</span>
      </div>
      <div>
        <span class="text-[10px] text-slate-400 font-medium block">Invertido</span>
        <span id="hdr-inv" class="text-xs font-bold text-slate-200">Bs 0.00</span>
      </div>
      <div>
        <span class="text-[10px] text-slate-400 font-medium block">Cobrado</span>
        <span id="hdr-cob" class="text-xs font-bold text-emerald-400">Bs 0.00</span>
      </div>
      <div>
        <span class="text-[10px] text-slate-400 font-medium block">Saldo Mesa</span>
        <span id="hdr-saldo" class="text-xs font-black text-white">Bs 24,100.00</span>
      </div>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="px-4 py-4 space-y-6 max-w-lg mx-auto">

    <!-- SECCION: DISPAROS INMINENTES -->
    <div>
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-xs font-black uppercase tracking-wider text-slate-400 flex items-center space-x-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span>Disparos Inminentes (Ordenes Activas)</span>
        </h2>
        <span id="count-inminentes" class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-800 text-slate-300">0 Activas</span>
      </div>

      <div id="inminentes-container" class="space-y-3">
        <!-- Se inyecta dinamicamente -->
      </div>
    </div>

    <!-- SECCION: RADAR DE LAS 7 RULETAS -->
    <div>
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-xs font-black uppercase tracking-wider text-slate-400 flex items-center space-x-1.5">
          <i data-lucide="radar" class="w-4 h-4 text-cyan-400"></i>
          <span>Radar de las 7 Ruletas Oficiales</span>
        </h2>
        <span class="text-[10px] text-slate-500 font-mono">Apuesta Bs 100 / ficha</span>
      </div>

      <div id="radar-container" class="space-y-2">
        <!-- Se inyecta dinamicamente -->
      </div>
    </div>

    <!-- SECCION: HISTORIAL DIARIO DE OPERACIONES -->
    <div>
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-xs font-black uppercase tracking-wider text-slate-400 flex items-center space-x-1.5">
          <i data-lucide="history" class="w-4 h-4 text-amber-400"></i>
          <span>Libro Contable de Hoy (Auditoria)</span>
        </h2>
        <button onclick="borrarHistorialHoy()" class="text-[10px] text-rose-400 hover:text-rose-300">Reiniciar Hoy</button>
      </div>

      <div id="historial-container" class="space-y-2">
        <!-- Se inyecta dinamicamente -->
      </div>
    </div>

  </main>

  <!-- MODAL: ANOTAR SORTEO -->
  <div id="modal-entrada" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="glass-card w-full max-w-sm rounded-2xl p-5 border border-slate-700 space-y-4">
      <div class="flex justify-between items-center pb-2 border-b border-slate-800">
        <h3 class="text-sm font-black text-white flex items-center space-x-2">
          <i data-lucide="check-circle" class="w-4 h-4 text-amber-400"></i>
          <span>Anotar Resultado Oficial</span>
        </h3>
        <button onclick="cerrarModalEntrada()" class="text-slate-400 hover:text-white">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="text-[11px] font-bold text-slate-300 block mb-1">Ruleta</label>
          <select id="in-ruleta" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs font-bold text-white focus:outline-none focus:border-emerald-500">
            <option value="Lotto Activo">🦁 Lotto Activo (30x)</option>
            <option value="Gatazo">🐯 Gatazo (60x)</option>
            <option value="Monje Millonario">🧘 Monje Millonario (60x)</option>
            <option value="Lotto Gato">🐱 Lotto Gato (60x)</option>
            <option value="Guacharo Activo">🦇 Guacharo Activo (60x)</option>
            <option value="Ruleta Royal">👑 Ruleta Royal (30x)</option>
            <option value="Loto Chaima">🏹 Loto Chaima (60x)</option>
            <option value="Granja Millonaria - Granjazo">🚜 Granja Millonaria - Granjazo (60x)</option>
            <option value="Mega Animal 40">🦚 Mega Animal 40 (30x)</option>
          </select>
        </div>

        <div>
          <label class="text-[11px] font-bold text-slate-300 block mb-1">Hora del Sorteo</label>
          <input type="text" id="in-hora" placeholder="Ej: 2:00 PM" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs font-mono text-white focus:outline-none focus:border-emerald-500">
        </div>

        <div>
          <label class="text-[11px] font-bold text-slate-300 block mb-1">Numero Salido</label>
          <input type="text" id="in-numero" placeholder="Ej: 34 o 00" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs font-mono font-black text-amber-400 text-lg focus:outline-none focus:border-amber-500">
          <span id="animal-preview" class="text-[11px] font-bold text-emerald-400 mt-1 block h-4"></span>
        </div>
      </div>

      <div class="pt-2 flex space-x-2">
        <button onclick="cerrarModalEntrada()" class="w-1/2 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold hover:bg-slate-700">Cancelar</button>
        <button onclick="procesarEntradaManual()" class="w-1/2 py-2 rounded-xl bg-emerald-500 text-slate-950 text-xs font-black hover:bg-emerald-400 shadow-lg shadow-emerald-500/20">Confirmar</button>
      </div>
    </div>
  </div>

    // 2. MOTOR MATEMATICO INSTITUCIONAL EXACTO DE PYTHON
    function calcularRachaYCandidatos(history, cfg) {
      if (!history || history.length < 40) {
        return { racha: 0, misses: 0, cands: [], ultimo_str: 'Sin datos', is_active: false };
      }

      const nums = history.map(r => String(r.numero).trim());
      const dates = history.map(r => String(r.fecha).trim());
      const lags = cfg.lags;
      const rec_w = cfg.rec_w;
      const use_anti = Boolean(cfg.anti_clustering);
      const blacklist = new Set((cfg.blacklist || []).map(b => String(b).trim()));
      const target_streaks = cfg.target_streaks || [1];

      let streak = 0;
      let trigger_misses = 0;
      let cur_d = null;
      let seen_today = new Set();
      let prev_was_repeat = false;

      const min_k = Math.max(Math.max(...lags), rec_w) + 1;

      for (let i = min_k; i < nums.length; i++) {
        const actual = nums[i];
        const d = dates[i];

        if (d !== cur_d) {
          cur_d = d;
          seen_today = new Set();
          prev_was_repeat = false;
        }

        const rec_set = new Set(nums.slice(i - rec_w, i));
        const raw_cands = [];
        for (let l of lags) {
          if (i - l >= 0) raw_cands.push(nums[i - l]);
        }

        const cands_set = new Set();
        for (let c of raw_cands) {
          if (!rec_set.has(c) && !blacklist.has(c)) {
            cands_set.add(c);
          }
        }

        const cands_arr = Array.from(cands_set).sort();
        const skip_anti = (use_anti && prev_was_repeat);

        if (cands_arr.length > 0 && !skip_anti) {
          const hit = cands_set.has(actual);
          if (target_streaks.includes(streak)) {
            trigger_misses = hit ? 0 : trigger_misses + 1;
          }
          streak = hit ? 0 : streak + 1;
        } else if (cands_arr.length > 0 && skip_anti) {
          const hit = cands_set.has(actual);
          streak = hit ? 0 : streak + 1;
          if (target_streaks.includes(streak)) {
            trigger_misses += 1;
          }
        }

        const is_rep = seen_today.has(actual);
        seen_today.add(actual);
        prev_was_repeat = is_rep;
      }

      // Candidatos para el PROXIMO sorteo
      const rec_set_now = new Set(nums.slice(-rec_w));
      const raw_now = [];
      for (let l of lags) {
        if (nums.length >= l) raw_now.push(nums[nums.length - l]);
      }

      const cands_now_set = new Set();
      for (let c of raw_now) {
        if (!rec_set_now.has(c) && !blacklist.has(c)) {
          cands_now_set.add(c);
        }
      }
      const cands_final = Array.from(cands_now_set).sort();

      const last_row = history[history.length - 1];
      const ultimo_str = '#' + last_row.numero + ' ' + (last_row.animal || ANIMALES[last_row.numero] || '') + ' (' + last_row.hora + ')';

      const is_anti_blocked = Boolean(use_anti && prev_was_repeat);
      const is_active = target_streaks.includes(streak) && !is_anti_blocked && cands_final.length > 0;

      return {
        racha: streak,
        misses: trigger_misses,
        cands: is_anti_blocked ? [] : cands_final,
        ultimo_str: ultimo_str,
        is_active: is_active
      };
    }

    // 4. ACTUALIZAR HISTORIAL Y BILLETERA
    function actualizarBilleteraYHistorial() {
      const w = JSON.parse(localStorage.getItem('wallet_v11')) || { bankroll: 23276.0, ledger: [] };
      const ledger = w.ledger || [];

      let hits = 0;
      let totInv = 0;
      let totCob = 0;
      for (let op of ledger) {
        if (op.condicion && op.condicion.includes('GANADA')) hits++;
        totInv += (op.total_bet || 0);
        totCob += (op.cobrado || 0);
      }

      document.getElementById('hdr-ops').innerText = `${ledger.length} (${hits} Hits)`;
      document.getElementById('hdr-inv').innerText = `Bs ${totInv.toLocaleString('es-VE', {minimumFractionDigits: 2})}`;
      document.getElementById('hdr-cob').innerText = `Bs ${totCob.toLocaleString('es-VE', {minimumFractionDigits: 2})}`;
      document.getElementById('hdr-saldo').innerText = `Bs ${(w.bankroll || 23276.0).toLocaleString('es-VE', {minimumFractionDigits: 2})}`;

      const histContainer = document.getElementById('historial-container');
      histContainer.innerHTML = '';

      if (ledger.length === 0) {
        histContainer.innerHTML = `
          <div class="glass-card rounded-xl p-4 text-center text-slate-500 text-xs">
            Aun no hay disparos ejecutados en la jornada de hoy.
          </div>
        `;
      } else {
        ledger.slice().reverse().forEach(op => {
          const esGanada = op.condicion && op.condicion.includes('GANADA');
          const borderClass = esGanada ? 'border-emerald-500/40 bg-emerald-950/20' : 'border-rose-900/30 bg-rose-950/10';
          const badgeClass = esGanada ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-rose-500/10 text-rose-400 border border-rose-500/20';
          const pnlText = (op.pnl >= 0 ? '+' : '') + 'Bs ' + (op.pnl || 0).toLocaleString('es-VE', {minimumFractionDigits: 2});

          histContainer.innerHTML += `
            <div class="glass-card rounded-xl p-3 border ${borderClass}">

                <div class="flex items-center space-x-2">
                  <span class="text-xs font-black text-white">${op.ruleta}</span>
                  <span class="text-[10px] text-slate-400 font-mono">${op.hora}</span>

                <span class="px-2 py-0.5 rounded text-[9px] font-black ${badgeClass}">${op.condicion}</span>

              </div>
            </div>
          `;
        });
      }
    }

    // 5. REGISTRO MANUAL DE SORTEO Y AUTO-LIQUIDACION DETERMINISTA
    function procesarEntradaManual() {
      const rName = document.getElementById('in-ruleta').value;
      const hora = document.getElementById('in-hora').value.trim();
      const num = document.getElementById('in-numero').value.trim();

      if (!hora || !num) {
        alert('Por favor introduce la hora y el numero salidos.');
        return;
      }

      const db = JSON.parse(localStorage.getItem('sniper_db_v11'));
      if (!db[rName]) return;

      const cfg = db[rName];
      const resPrev = calcularRachaYCandidatos(cfg.history, cfg);
      const w = JSON.parse(localStorage.getItem('wallet_v11'));

      const animalName = ANIMALES[num] || 'ANIMAL';
      const hoyStr = new Date().toISOString().split('T')[0];

      // Si habia disparo activo en esa ruleta, LIQUIDAR APUESTA
      if (resPrev.is_active && resPrev.cands.length > 0) {
        const fichasCount = resPrev.cands.length;
        const totalBet = fichasCount * 100.0;
        const hit = resPrev.cands.includes(num);
        const cobrado = hit ? (100.0 * cfg.payout) : 0.0;
        const pnl = cobrado - totalBet;

        w.bankroll = Math.round((w.bankroll + pnl) * 100) / 100;

        const nuevaOp = {
          hora: hora,
          ruleta: rName,
          candidatos: resPrev.cands.map(c => '#' + c + ' ' + (ANIMALES[c] || '')).join(', '),
          resultado: `[${num}] ${animalName}`,
          condicion: hit ? '🟢 GANADA' : '🔴 PERDIDA',
          total_bet: totalBet,
          cobrado: cobrado,
          pnl: pnl,
          saldo: w.bankroll
        };

        if (!w.ledger) w.ledger = [];
        w.ledger.push(nuevaOp);
        localStorage.setItem('wallet_v11', JSON.stringify(w));
      }

      // Incorporar sorteo al historial de la ruleta
      cfg.history.push({
        fecha: hoyStr,
        hora: hora,
        numero: num,
        animal: animalName
      });

      // Guardar base de datos
      localStorage.setItem('sniper_db_v11', JSON.stringify(db));

      cerrarModalEntrada();
      document.getElementById('in-numero').value = '';
      document.getElementById('in-hora').value = '';
      document.getElementById('animal-preview').innerText = '';

      ejecutarEvaluacionCompleta();
    }

    function borrarHistorialHoy() {
      if (confirm('¿Deseas reiniciar el libro contable de hoy en el celular?')) {
        const w = JSON.parse(localStorage.getItem('wallet_v11')) || {};
        w.ledger = [];
        localStorage.setItem('wallet_v11', JSON.stringify(w));
        actualizarBilleteraYHistorial();
      }
    }

    // MODAL HELPERS
    function abrirModalEntrada() {
      document.getElementById('modal-entrada').classList.remove('hidden');
      document.getElementById('modal-entrada').classList.add('flex');
    }
    function cerrarModalEntrada() {
      document.getElementById('modal-entrada').classList.add('hidden');
      document.getElementById('modal-entrada').classList.remove('flex');
    }

    // AUTO-COMPLETAR ANIMALITO AL ESCRIBIR NUMERO
    document.getElementById('in-numero').addEventListener('input', function(e) {
      const val = e.target.value.trim();
      const prev = document.getElementById('animal-preview');
      if (ANIMALES[val]) {
        prev.innerText = '-> ' + ANIMALES[val];
      } else {
        prev.innerText = '';
      }
    });

    // RELOJ EN TIEMPO REAL
    setInterval(() => {
      const now = new Date();
      const r = document.getElementById('reloj-header');
      if (r) r.innerText = now.toLocaleTimeString('es-VE');
    }, 1000);

    // INICIAR AL CARGAR
    window.addEventListener('DOMContentLoaded', inicializarSistemaAutonomo);
  </script>
</body>
</html>
